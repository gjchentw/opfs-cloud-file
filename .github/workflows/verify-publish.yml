name: Verify Publish

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Run tests with coverage
      run: npm test -- --coverage
    - name: Validate coverage thresholds
      run: |
        COVERAGE_OUTPUT=$(npm test -- --coverage --silent 2>&1)
        if echo "$COVERAGE_OUTPUT" | grep -q "FAIL.*Coverage"; then
          echo "ERROR: Coverage thresholds not met"
          exit 1
        fi
        echo "Coverage thresholds validated"
    - name: Validate entry points
      run: node scripts/validate-entry-points.cjs
    - name: Validate package contents
      run: node scripts/validate-package-contents.cjs
    - name: Verify CHANGELOG.md exists
      run: |
        if [ ! -f "CHANGELOG.md" ]; then
          echo "ERROR: CHANGELOG.md is required for release"
          exit 1
        fi
    - name: Verify version consistency
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        echo "Package version: $PACKAGE_VERSION"
        echo "Note: This workflow does not publish, it only verifies"
    - name: Dry-run npm publish
      run: |
        # Use npm publish --dry-run to verify publishing without actual publication
        npm publish --dry-run
        echo "Dry-run complete - NO actual package was published"
